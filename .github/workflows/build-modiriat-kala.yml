name: Build Modiriat Kala Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "modiriat-kala/**"
      - ".github/workflows/build-modiriat-kala.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Build Modiriat Kala release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        working-directory: modiriat-kala
        run: npm install

      - name: Render storefront launcher icon
        working-directory: modiriat-kala
        run: |
          npm install --no-save sharp
          node -e "require('sharp')('./assets/store-icon.svg').resize(1024,1024).png().toFile('./assets/icon.png').then(()=>console.log('Storefront icon generated'))"

      - name: Generate Android native project
        working-directory: modiriat-kala
        run: npx expo prebuild --platform android --non-interactive

      - name: Build release APK
        working-directory: modiriat-kala/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: modiriat-kala-android-apk
          path: modiriat-kala/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
