name: Build Didban Zhian Android Release APK

on:
  push:
    branches: [main, feature/didban-location-map]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build release APK with bundled JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Render custom launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          convert -background none assets/rasadgar-icon.svg -resize 1024x1024 assets/rasadgar-icon.png

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace --warning-mode all 2>&1 | tee ../android-build.log

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: didban-zhian-build-diagnostics
          path: android-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Prepare clearly named APK
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/Didban-Zhian.apk

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: didban-zhian-android-apk
          path: android/app/build/outputs/apk/release/Didban-Zhian.apk
          if-no-files-found: error
          retention-days: 14
